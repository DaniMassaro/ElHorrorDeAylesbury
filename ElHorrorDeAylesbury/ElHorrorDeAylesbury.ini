name.Spanish=El horror de Aylesbury
name.Italiano=L' orrore di Aylesbury
synopsys.Spanish=Extrañas e inexplicables muertes, desapariciones, robos... ¿Qué misterios albergará Aylesbury?
synopsys.Italiano=Morti strane e inspiegabili, sparizioni, rapine... Quali misteri cela Aylesbury?
description.Spanish=Te llega información de que en Aylesbury, un pequeño y tranquilo pueblo de Massachusetts cercano a Dunwich, están sucediendo espantosos y misteriosos acontecimientos, como extrañas e inexplicables muertes, desapariciones o robos.\n\nAllí, el nuevo sheriff hace sonar una campana antes de que se ponga el sol en señal de advertencia para que todos los habitantes del sombrío y desapacible pueblo se cobijen en sus casas, todas ellas cubiertas por enormes y robustos tablones de madera.\n\n¿Qué misterios albergará Aylesbury... especialmente por las noches? \n-----\n<i>*El escenario es largo y está dividido en dos partes. *Recomiendo no jugarlo del tirón, sino en dos (o más) veces (como si fuera una minicampaña). \n*Nº de investigadores: de 2 a 5. ·De 160 a 210 minutos (partida larga). \n*Escenario narrativo de investigación (bastante texto). \n*Requiere el juego base de Mansiones de la locura y la expansión Calles de Arkham.\n-----\n*Gracias a Vidimus (sin el cual Valkyrie no sería lo que es) por el testeo y los consejos. </i>
description.Italiano=Ti giunge notizia che eventi orribili e misteriosi — come morti strane e inspiegabili, sparizioni e furti — stanno accadendo ad Aylesbury, una piccola e tranquilla cittadina del Massachusetts vicino a Dunwich. \n\n Lì, il nuovo sceriffo suona una campana prima del tramonto per avvertire gli abitanti di questa cupa e inospitale cittadina di rifugiarsi nelle proprie case, tutte sbarrate con pesanti e robuste assi di legno. \n\n Quali misteri si celano ad Aylesbury... specialmente di notte? \n----- \n<i>*Questo scenario è lungo e suddiviso in due parti. *Consiglio di giocarlo in due (o più) sessioni anziché tutto d'un fiato (come una mini-campagna). \n*Numero di investigatori: da 2 a 5. ·Da 160 a 210 minuti (partita lunga). \n*Scenario investigativo narrativo (ricco di testo). \n*Richiede il gioco base "Le Case della Follia" e l'espansione "Strade di Arkham". \n----- \n*Un ringraziamento a Vidimus (senza il quale Valkyrie non sarebbe quello che è) per il playtest e i consigli. </i>
