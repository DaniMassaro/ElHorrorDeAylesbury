synopsys.Spanish=Extrañas e inexplicables muertes, desapariciones, robos... ¿Qué misterios albergará Aylesbury?
synopsys.Italian=Morti strane e inspiegabili, sparizioni, rapine... Quali misteri cela Aylesbury?
synopsys.Polish=Dziwne, niewyjaśnione zgony, zaginięcia, kradzieże... Jakie tajemnice kryje Aylesbury?
description.Spanish=Te llega información de que en Aylesbury, un pequeño y tranquilo pueblo de Massachusetts cercano a Dunwich, están sucediendo espantosos y misteriosos acontecimientos, como extrañas e inexplicables muertes, desapariciones o robos.\n\nAllí, el nuevo sheriff hace sonar una campana antes de que se ponga el sol en señal de advertencia para que todos los habitantes del sombrío y desapacible pueblo se cobijen en sus casas, todas ellas cubiertas por enormes y robustos tablones de madera.\n\n¿Qué misterios albergará Aylesbury... especialmente por las noches? \n-----\n<i>*El escenario es largo y está dividido en dos partes. *Recomiendo no jugarlo del tirón, sino en dos (o más) veces (como si fuera una minicampaña). \n*Nº de investigadores: de 2 a 5. ·De 160 a 210 minutos (partida larga). \n*Escenario narrativo de investigación (bastante texto). \n*Requiere el juego base de Mansiones de la locura y la expansión Calles de Arkham.\n-----\n*Gracias a Vidimus (sin el cual Valkyrie no sería lo que es) por el testeo y los consejos. </i>
description.Italian=Ti giunge notizia che eventi orribili e misteriosi — come morti strane e inspiegabili, sparizioni e furti — stanno accadendo ad Aylesbury, una piccola e tranquilla cittadina del Massachusetts vicino a Dunwich. \n\n Lì, il nuovo sceriffo suona una campana prima del tramonto per avvertire gli abitanti di questa cupa e inospitale cittadina di rifugiarsi nelle proprie case, tutte sbarrate con pesanti e robuste assi di legno. \n\n Quali misteri si celano ad Aylesbury... specialmente di notte? \n----- \n<i>*Questo scenario è lungo e suddiviso in due parti. *Consiglio di giocarlo in due (o più) sessioni anziché tutto d'un fiato (come una mini-campagna). \n*Numero di investigatori: da 2 a 5. ·Da 160 a 210 minuti (partita lunga). \n*Scenario investigativo narrativo (ricco di testo). \n*Richiede il gioco base "Le Case della Follia" e l'espansione "Strade di Arkham". \n----- \n*Un ringraziamento a Vidimus (senza il quale Valkyrie non sarebbe quello che è) per il playtest e i consigli. </i>  Traduzione in italiano: Gianni Giudice
description.Polish=W ostatnim czasie dotarły do was doniesienia, że w Aylesbury, niewielkim i spokojnym miasteczku w stanie Massachusetts, niedaleko Dunwich, dochodzi do przerażających i tajemniczych wydarzeń: niewyjaśnionych zgonów, zaginięć oraz kradzieży.\n\nPlotka głosi, że nowy szeryf tego ponurego miasteczka nie radzi sobie z problemem - zamiast tego, bije w dzwon tuż przed zachodem słońca, ostrzegając mieszkańców, że powinni schronić się w domach. Okna wszystkich budynków zabito grubymi, solidnymi deskami.\n\nJakie tajemnice skrywa Aylesbury... zwłaszcza nocą?\n-----\n<i>*Scenariusz jest długi i podzielony na dwie części. *Zalecam rozegrać go podczas dwóch (lub więcej) spotkań, niczym minikampanię.\n*Liczba badaczy: od 2 do 5. ·Od 160 do 210 minut (długa rozgrywka).\n*Scenariusz fabularno-detektywistyczny (dużo tekstu).\n*Wymaga podstawowej wersji Posiadłości Szaleństwa oraz dodatku Ulice Arkham.\n-----\n*Podziękowania dla Vidimusa (bez którego Valkyrie nie byłoby tym, czym jest) za testowanie i wskazówki.</i>
