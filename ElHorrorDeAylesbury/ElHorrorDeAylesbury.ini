synopsys.Italiano=Morti strane e inspiegabili, sparizioni, rapine... Quali misteri cela Aylesbury?
synopsys.Italian=Morti strane e inspiegabili, sparizioni, rapine... Quali misteri cela Aylesbury?
description.Italiano=Ti giunge notizia che eventi orribili e misteriosi — come morti strane e inspiegabili, sparizioni e furti — stanno accadendo ad Aylesbury, una piccola e tranquilla cittadina del Massachusetts vicino a Dunwich. \n\n Lì, il nuovo sceriffo suona una campana prima del tramonto per avvertire gli abitanti di questa cupa e inospitale cittadina di rifugiarsi nelle proprie case, tutte sbarrate con pesanti e robuste assi di legno. \n\n Quali misteri si celano ad Aylesbury... specialmente di notte? \n----- \n<i>*Questo scenario è lungo e suddiviso in due parti. *Consiglio di giocarlo in due (o più) sessioni anziché tutto d'un fiato (come una mini-campagna). \n*Numero di investigatori: da 2 a 5. ·Da 160 a 210 minuti (partita lunga). \n*Scenario investigativo narrativo (ricco di testo). \n*Richiede il gioco base "Le Case della Follia" e l'espansione "Strade di Arkham". \n----- \n*Un ringraziamento a Vidimus (senza il quale Valkyrie non sarebbe quello che è) per il playtest e i consigli. </i>  Traduzione in italiano: Gianni Giudice
